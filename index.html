<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group 7 – Portfolio nhóm</title>
<meta name="description" content="Group 7: portfolio của sáu thành viên trong nhóm. Chọn một thành viên để xem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/team.css">
</head>
<body data-view="team">
<canvas id="magic" data-mode="team"></canvas>

<div id="view-team">
  <main class="tm">
    <div class="thero">
      <svg class="circle" viewBox="0 0 600 600" aria-hidden="true">
        <g><circle cx="300" cy="300" r="290" stroke-dasharray="2 9"/><circle cx="300" cy="300" r="268"/>
           <polygon points="300,40 525,430 75,430"/><polygon points="300,560 75,170 525,170"/></g>
        <g class="rev"><circle cx="300" cy="300" r="215" stroke-dasharray="18 6 2 6"/><circle cx="300" cy="300" r="150"/>
           <rect x="205" y="205" width="190" height="190"/><rect x="205" y="205" width="190" height="190" transform="rotate(45 300 300)"/></g>
      </svg>
      <h1><i>Group</i> 7</h1>
      <div class="orn" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M7 0l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg></div>
      <p>Nhóm mình có 6 thành viên. Bấm vào tên để xem thêm chi tiết nè.</p>
    </div>
    <ul class="grid" id="grid"></ul>
  </main>
</div>

<script src="assets/magic.js"></script>
<script>
/* ============================================================
   DANH SÁCH THÀNH VIÊN. Khi một bạn đã tải trang của mình lên,
   đổi  ready: false  thành  ready: true  ở dòng của bạn đó.
   - file:  tên file trong thư mục members (không cần ghi .html)
   - photo: đường dẫn ảnh, ví dụ "assets/thanh.jpg" (để "" thì hiện chữ cái đầu)
   ============================================================ */
var MEMBERS = [
  { name: "Đoàn Duy Thanh",      file: "thanh", ready: false, photo: "" },
  { name: "Nguyễn Thị Cẩm Tiên", file: "tien",  ready: true,  photo: "assets/tien.jpg" },
  { name: "Đặng Gia Bảo",        file: "bao",   ready: false, photo: "" },
  { name: "Thạch Thị Trâm",      file: "tram",  ready: false, photo: "" },
  { name: "Nguyễn Thị Anh Thư",  file: "thu",   ready: false, photo: "" },
  { name: "Nguyễn Tuấn Kiệt",    file: "kiet",  ready: false, photo: "" }
];

(function () {
  var grid = document.getElementById("grid");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  MEMBERS.forEach(function (m) {
    var li = document.createElement("li");
    var initial = m.name.trim().split(/\s+/).pop().charAt(0).toUpperCase();
    var av = m.photo ? '<img src="' + m.photo + '" alt="Ảnh ' + m.name + '">' : initial;
    var inner = '<span class="av">' + av + '</span><span><b>' + m.name + '</b><small>' + (m.ready ? "Xem portfolio" : "Đang cập nhật") + "</small></span>";
    li.innerHTML = m.ready
      ? '<a class="card on" href="members/' + m.file + '.html" data-magic>' + inner + "</a>"
      : '<div class="card off">' + inner + "</div>";
    grid.appendChild(li);
  });

  /* Bấm vào thẻ: vòng sáng lan ra rồi mới chuyển trang */
  grid.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-magic]");
    if (!a || reduce || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault();
    var r = a.getBoundingClientRect(), p = document.createElement("div");
    p.className = "portal";
    p.style.setProperty("--x", (r.left + r.width / 2) + "px");
    p.style.setProperty("--y", (r.top + r.height / 2) + "px");
    document.body.appendChild(p);
    requestAnimationFrame(function () { requestAnimationFrame(function () { p.classList.add("go"); }); });
    setTimeout(function () { location.href = a.href; }, 720);
  });
  addEventListener("pageshow", function () { document.querySelectorAll(".portal").forEach(function (p) { p.remove(); }); });
})();
</script>
</body>
</html>
